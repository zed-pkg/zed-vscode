name: materialize reviewed npm lockfile once

on:
  push:
    branches:
      - agent/den-2508-repo-ci-release-gates
    paths:
      - .github/workflows/materialize-package-lock.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'zed-pkg/zed-vscode' && github.ref == 'refs/heads/agent/den-2508-repo-ci-release-gates'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2508-repo-ci-release-gates
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Generate deterministic lock candidate
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact root tool identities
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const deps = lock.packages[''].devDependencies;
          if (lock.lockfileVersion !== 3) throw new Error('expected lockfileVersion 3');
          if (deps['@vscode/test-electron'] !== '2.5.2') throw new Error('unexpected @vscode/test-electron identity');
          if (deps['@vscode/vsce'] !== '3.9.2') throw new Error('unexpected @vscode/vsce identity');
          NODE
      - name: Commit only package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -f package-lock.json
          unexpected="$(git status --short | awk '$2 != "package-lock.json" {print}')"
          test -z "$unexpected" || { echo "unexpected worktree changes:" >&2; echo "$unexpected" >&2; exit 1; }
          git add package-lock.json
          git config user.name 'zed-pkg lock materializer'
          git config user.email 'noreply@github.com'
          git commit -m 'build: commit locked VS Code tooling graph'
          git push origin HEAD:agent/den-2508-repo-ci-release-gates
